name: Engineering author proof

on:
  workflow_dispatch:
    inputs:
      proof_id:
        description: Disposable Issue 136 proof marker
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Create a machine-authored release-control PR
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_ID: ${{ inputs.proof_id }}
        run: |
          set -euo pipefail
          [[ "$PROOF_ID" =~ ^[A-Za-z0-9._-]{1,40}$ ]] || {
            echo "Invalid proof_id" >&2
            exit 1
          }

          branch="machine-author/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'vercel.json';
          const value = JSON.parse(readFileSync(path, 'utf8'));
          writeFileSync(path, `${JSON.stringify(value, null, 4)}\n`);
          NODE

          node scripts/validate-vercel-config.mjs vercel.json
          git diff --check
          test -n "$(git diff --name-only)"
          test "$(git diff --name-only)" = "vercel.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json
          git commit -m "test: machine-authored release-control PR ($PROOF_ID)"
          git push origin "HEAD:refs/heads/$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "P8 — machine-authored release-control PR ($PROOF_ID)" \
            --body "Disposable Issue #136 proof only. This PR was authored by the repository-scoped GitHub Actions machine identity, not by the Product Owner account. It makes a semantic no-op formatting change to CODEOWNED vercel.json so the human-review separation can be proven. No Chasum/GVM resource is involved."
